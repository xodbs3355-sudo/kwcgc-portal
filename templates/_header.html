<header class="portal-header">
  <div class="portal-header-left">
    <span class="portal-logo">준공서류 검토 프로그램<sup class="portal-logo-sub">(63A &amp; 10m이하 수요가배관 전용)</sup></span>
  </div>
  <div class="portal-header-right">
    {% if available_years %}
      <select class="year-select" id="header-year" title="검토 연도 선택">
        <option value="">연도 선택</option>
        {% for y in available_years %}
          <option value="{{ y }}" {% if sess_project_info.get('year') == y %}selected{% endif %}>{{ y }}</option>
        {% endfor %}
      </select>
    {% endif %}
    <span class="company-badge">{{ company }}</span>
    <form method="post" action="{{ url_for('logout') }}" style="margin:0;">
      <button type="submit" class="logout-btn">로그아웃</button>
    </form>
  </div>
</header>

<nav class="tabs">
  <a class="tab {% if active_tab == 'upload' %}active{% endif %}" href="{{ url_for('index') }}">
    <span class="tab-num">1</span>준공 정보 입력
  </a>
  <a class="tab {% if active_tab == 'result' %}active{% endif %} {% if not has_result %}disabled{% endif %}"
     href="{% if has_result %}{{ url_for('result') }}{% else %}#{% endif %}">
    <span class="tab-num">2</span>준공서류 검토 결과
  </a>
  {% if is_admin %}
    <a class="tab tab-prices {% if active_tab == 'unit_prices' %}active{% endif %}"
       href="{{ url_for('admin_unit_prices') }}">
      <svg class="tab-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="9" y1="9" x2="9" y2="20"/>
        <line x1="15" y1="9" x2="15" y2="20"/>
      </svg>연간단가표
    </a>
    <a class="tab tab-admin {% if active_tab == 'admin' %}active{% endif %}"
       href="{{ url_for('admin_prompts') }}">
      <svg class="tab-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="9" r="2.6"/>
        <path d="M9 4.4v1.2 M9 12.4v1.2 M4.4 9h1.2 M12.4 9h1.2
                 M5.7 5.7l.85.85 M11.45 11.45l.85.85
                 M12.3 5.7l-.85.85 M6.55 11.45l-.85.85"/>
        <circle cx="16.5" cy="16.5" r="2"/>
        <path d="M16.5 13v1 M16.5 19v1 M13 16.5h1 M19 16.5h1
                 M14.1 14.1l.7.7 M18.2 18.2l.7.7
                 M18.9 14.1l-.7.7 M14.8 18.2l-.7.7"/>
      </svg>서류항목 별 검토 로직(프롬프트 설정)
    </a>
  {% endif %}
</nav>

<script>
// 헤더의 연도 드롭다운 — 변경 시 세션에 저장 (어느 페이지서나 동작)
(function(){
  var sel = document.getElementById('header-year');
  if (!sel) return;
  sel.addEventListener('change', function(){
    var fd = new FormData();
    fd.append('field', 'year');
    fd.append('value', sel.value);
    fetch('/project-info', { method: 'POST', body: fd }).catch(function(){});
  });
})();
</script>
