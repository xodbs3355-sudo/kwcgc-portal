{% extends "base.html" %}
{% block title %}로그인 — 준공서류 검토 프로그램{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <h1 class="login-title">준공서류 검토 프로그램</h1>
    <p class="login-sub">업체 계정으로 로그인하세요</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="alert alert-{{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" action="{{ url_for('login') }}" class="login-form">
      <input type="text" name="username" placeholder="업체 아이디" autocomplete="username" required autofocus>
      <input type="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
      <button type="submit" class="btn-primary">로그인</button>
    </form>
  </div>
</div>
<script>
  document.querySelectorAll('.login-form input').forEach((input) => {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        input.closest('form').submit();
      }
    });
  });
</script>
{% endblock %}
